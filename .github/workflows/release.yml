name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
            goos: darwin
          - os: macos-15-intel
            arch: amd64
            goos: darwin
          - os: windows-latest
            arch: amd64
            goos: windows
          - os: windows-11-arm
            arch: arm64
            goos: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      TARGET_ARCH: ${{ matrix.arch }}
      TARGET_OS: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate release tag and runner
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(go env GOARCH)" = "$TARGET_ARCH"
          test "$(go env GOOS)" = "$TARGET_OS"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
      - run: go test ./...
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
      - name: Build release binary
        env:
          CGO_ENABLED: "0"
        run: |
          output=bin/cdt
          if [[ "$TARGET_OS" == windows ]]; then output=bin/cdt.exe; fi
          go build -trimpath -ldflags="-s -w -X main.version=${RELEASE_TAG#v}" -o "$output" ./cmd/cdt
      - run: zsh -n shell/cdt.zsh
        if: runner.os == 'macOS'
      - run: python3 tests/zsh_pty.py -v
        if: runner.os == 'macOS'
      - run: pwsh -NoProfile -NonInteractive -File tests/powershell.ps1
        shell: pwsh
        if: runner.os == 'Windows'
      - run: python tests/powershell_pty.py -v
        shell: pwsh
        if: runner.os == 'Windows'
      - name: Package tested binary
        if: runner.os == 'macOS'
        run: |
          test "$(./bin/cdt --version)" = "cdt ${RELEASE_TAG#v}"
          mkdir -p dist
          tar -czf "dist/cdt_${RELEASE_TAG#v}_darwin_${TARGET_ARCH}.tar.gz" -C bin cdt -C .. LICENSE README.md CHANGELOG.md
      - name: Package tested Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          if ((.\bin\cdt.exe --version) -ne "cdt $version") { throw 'binary version mismatch' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -LiteralPath bin/cdt.exe, LICENSE, README.md, CHANGELOG.md -DestinationPath "dist/cdt_${version}_windows_$($env:TARGET_ARCH).zip"
      - uses: actions/upload-artifact@v4
        with:
          name: cdt-${{ matrix.goos }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cdt-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > checksums.txt
      - name: Publish tested packages
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes dist/*
          gh release edit "$RELEASE_TAG" --draft=false
