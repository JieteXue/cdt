name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o bin/cdt ./cmd/cdt
      - run: zsh -n shell/cdt.zsh
      - run: python3 tests/zsh_pty.py -v
      - name: Cross-compile both macOS architectures
        run: |
          GOOS=darwin GOARCH=arm64 go build -o dist/cdt-arm64 ./cmd/cdt
          GOOS=darwin GOARCH=amd64 go build -o dist/cdt-amd64 ./cmd/cdt
